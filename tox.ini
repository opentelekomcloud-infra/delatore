[tox]
minversion = 3.7
envlist = py37,py38,py39
skipsdist = True
ignore_basepython_conflict = True

[testenv]
usedevelop = True
basepython = python3
install_command = pip install {opts} {packages}
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
commands =
    pytest ./tests/01_unit/

[testenv:linters]
deps =
    {[testenv]deps}
    pylint
    pylint-quotes
    pylint-mccabe
commands =
    pylint delatore --disable=C0301

[testenv:cover]
commands =
    pytest tests --cov delatore
