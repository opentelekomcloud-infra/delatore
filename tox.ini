[tox]
isolated_build = true
minversion = 3.1
envlist = py37,pep8
skipsdist = True
ignore_basepython_conflict = True

[testenv]
usedevelop = true
install_command = pip install -U {opts} {packages}
whitelist_externals = poetry
deps =
    poetry
    pytest
commands =
    poetry install -v --no-root
    poetry run pytest ./tests/01_unit/

[testenv:linters]
basepython = /usr/bin/python3.7
deps =
    pylint
    pylint-quotes
    apubsub
    pyyaml-typed
commands =
    - pylint delatore
