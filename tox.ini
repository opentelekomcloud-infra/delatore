[tox]
isolated_build = true
minversion = 3.1
envlist = py37,pep8
skipsdist = True
ignore_basepython_conflict = True

[testenv]
whitelist_externals = poetry
deps = pytest
commands =
    poetry install -v
    poetry run pytest {posargs}

[testenv:linters]
deps = 
    pylint 
    pylint-quotes
commands =
    pylint delatore
