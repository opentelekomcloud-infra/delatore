[tox]
isolated_build = true
minversion = 3.1
envlist = py37,pep8
skipsdist = True
ignore_basepython_conflict = True
indexserver =
    default = https://pypi.org/

[testenv]
whitelist_externals = poetry
deps =
    poetry
    pytest
    -r{toxinidir}/test-requirements.txt
    -r{toxinidir}/requirements.txt
commands =
    poetry install -v --no-root
    poetry run pytest {posargs}

[testenv:linters]
deps =
    pylint
    pylint-quotes
    -r{toxinidir}/test-requirements.txt
    -r{toxinidir}/requirements.txt
commands =
    pylint delatore
