[tox]
isolated_build = true
minversion = 3.1
envlist = py37,pep8
skipsdist = True
ignore_basepython_conflict = True

[testenv]
whitelist_externals = poetry
deps =
    poetry
    pytest
commands =
    poetry install -v --no-root
    poetry run pytest {posargs}

[testenv:linters]
install_command =
    pip install -U {opts} {packages}
deps =
    pylint
    pylint-quotes
    flake8
    -r{toxinidir}/test-requirements.txt
commands =
    pylint delatore
    flake8 delatore
