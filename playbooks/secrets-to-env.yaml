---
- hosts: all
  tasks:
    - name: Install secrets
      command: env
      environment:
        token: "{{ telegram.token }}"
        chat_id: "{{ telegram.chat_id }}"
        awx_auth_token: "{{ sources.awx_auth_token }}"
        influx_password: "{{ sources.influx_password }}"
        alerta_api_key: "{{ alerta.alerta_api_key }}"
        alerta_service: "{{ alerta.alerta_service }}"
